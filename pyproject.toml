[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "micompress"
dynamic = ["version"]
description = "Compress images, PDFs, video, audio, documents & archives from the command line — powered by micompress.com"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "MiCompress" }]
keywords = ["compress", "compression", "image", "pdf", "optimize", "minify", "cli", "micompress"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://micompress.com"
"Source" = "https://github.com/micompress/micompress-python"

[project.scripts]
micompress = "micompress.cli:main"

[tool.setuptools]
packages = ["micompress"]

[tool.setuptools.dynamic]
version = { attr = "micompress.__version__" }
